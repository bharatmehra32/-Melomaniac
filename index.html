<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melomaniac - Music Streaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>Melomaniac</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-tab="home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="#" class="nav-item" data-tab="search">
                    <i class="fas fa-search"></i> Search
                </a>
                <a href="#" class="nav-item" data-tab="my-music">
                    <i class="fas fa-music"></i> My Music
                </a>
                <a href="#" class="nav-item" data-tab="upload">
                    <i class="fas fa-upload"></i> Upload
                </a>
                <a href="#" class="nav-item" data-tab="favorites">
                    <i class="fas fa-heart"></i> Favorites
                </a>
            </nav>

            <!-- User Menu -->
            <div class="user-menu">
                <div class="user-info" id="user-info">
                    <!-- User info will be loaded here -->
                </div>
                <div class="user-actions">
                    <a href="/profile" class="user-action">
                        <i class="fas fa-user"></i> Profile
                    </a>
                    <button class="user-action logout-btn" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search songs, artists..." class="search-input">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Home Tab -->
                <div id="home-tab" class="tab-content active">
                    <section class="featured">
                        <h2>Featured Tracks</h2>
                        <div class="track-grid" id="featured-tracks"></div>
                    </section>
                </div>

                <!-- Search Results Tab -->
                <div id="search-tab" class="tab-content">
                    <h2>Search Results</h2>
                    <div class="track-list" id="search-results"></div>
                </div>

                <!-- My Music Tab -->
                <div id="my-music-tab" class="tab-content">
                    <h2>My Music</h2>
                    <div class="track-list" id="my-music-list"></div>
                </div>

                <!-- Upload Tab -->
                <div id="upload-tab" class="tab-content">
                    <div class="upload-section">
                        <h2>Upload Music</h2>
                        <div class="upload-container">
                            <input type="file" id="music-upload" accept="audio/*" multiple style="display: none;">
                            <button id="upload-btn" class="upload-button">
                                <i class="fas fa-cloud-upload-alt"></i>
                                Choose Music Files
                            </button>
                            <p class="upload-info">Supported formats: MP3, WAV, OGG, M4A, AAC, FLAC (Max 50MB each)</p>
                            <div id="upload-progress" class="upload-progress" style="display: none;">
                                <div class="progress-bar">
                                    <div class="progress-fill" id="progress-fill"></div>
                                </div>
                                <p id="progress-text">Uploading...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Favorites Tab -->
                <div id="favorites-tab" class="tab-content">
                    <h2>Your Favorites</h2>
                    <div class="track-list" id="favorites-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Player -->
    <div class="player-container">
        <div class="now-playing">
            <img id="album-art" src="https://via.placeholder.com/60" alt="Album Art">
            <div class="now-playing-info">
                <div class="song-name">Select a song</div>
                <div class="artist-name">Melomaniac</div>
            </div>
        </div>
        <div class="player-controls">
            <button id="like-btn" class="control-btn" title="Like">
                <i class="far fa-heart"></i>
            </button>
            <button id="prev-btn" class="control-btn" title="Previous">
                <i class="fas fa-step-backward"></i>
            </button>
            <button id="play-pause-btn" class="control-btn play-btn" title="Play">
                <i class="fas fa-play"></i>
            </button>
            <button id="next-btn" class="control-btn" title="Next">
                <i class="fas fa-step-forward"></i>
            </button>
            <button id="repeat-btn" class="control-btn" title="Repeat">
                <i class="fas fa-redo"></i>
            </button>
        </div>
        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>
        <audio id="audio-player"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
